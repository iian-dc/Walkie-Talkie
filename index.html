<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Reparto</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#top{padding:12px;background:#1e1e1e;display:flex;gap:8px}input{flex:1;padding:10px;border-radius:8px;border:0}button{padding:10px 14px;border-radius:8px;border:0;font-weight:700}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{background:#222;padding:10px;border-radius:12px;max-width:85%}.me{background:#0b5cff;align-self:flex-end}
#ptt{padding:16px;background:#1e1e1e;text-align:center}
#btnHablar{width:90%;padding:22px;border-radius:50px;background:#22c55e;font-size:20px;font-weight:900;border:0;touch-action:none;user-select:none}
#btnHablar.hablando{background:#ef4444;transform:scale(0.97)}
audio{width:100%}
</style></head>
<body>
<div id="top">
<input id="sala" placeholder="Nombre sala ej: reparto1" value="reparto1">
<input id="nombre" placeholder="Tu nombre ej: Jefe" style="max-width:110px">
<button id="entrar" style="background:#22c55e">ENTRAR</button>
</div>
<div id="chat"></div>
<div id="ptt">
<div id="estado" style="margin-bottom:8px;opacity:.7">Mantén presionado para hablar</div>
<button id="btnHablar">🎤 MANTÉN PARA HABLAR</button>
<div style="margin-top:10px;display:flex;gap:8px;justify-content:center">
<button id="btnNota" style="background:#333;color:#fff">🎙️ Enviar nota de voz</button>
<button id="btnSilenciar" style="background:#333;color:#fff">🔇 Silenciar</button>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDvetl-4f68ykb5GpGSZtCAvOeetKmnh-4",authDomain:"menu-digital-12e66.firebaseapp.com",databaseURL:"https://menu-digital-12e66-default-rtdb.firebaseio.com",projectId:"menu-digital-12e66",appId:"1:388372771516:web:516a80aeeecc1ab8f756b9"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let localStream, pcs={}, salaActual="", miNombre="Yo", muted=false;
const chat=document.getElementById('chat'); const btnHablar=document.getElementById('btnHablar');

function addMsg(html,me=false){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

async function entrar(){
 salaActual=document.getElementById('sala').value.trim().toLowerCase()||'reparto1';
 miNombre=document.getElementById('nombre').value.trim()||'Anonimo';
 localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
 addMsg('✅ Entraste a '+salaActual+' como '+miNombre,true);
 const salaRef=db.ref('radio/'+salaActual+'/users');
 const yoRef=salaRef.push({nombre:miNombre,ts:Date.now()}); yoRef.onDisconnect().remove();
 salaRef.on('child_added',async snap=>{if(snap.key==yoRef.key) return; crearPC(snap.key,snap.val(),true);});
 salaRef.on('child_removed',snap=>{if(pcs[snap.key]){pcs[snap.key].close();delete pcs[snap.key];}});
 db.ref('radio/'+salaActual+'/signals/'+yoRef.key).on('child_added',async snap=>{
   const s=snap.val(); const id=s.from;
   if(!pcs[id]) crearPC(id,{nombre:s.nombre},false);
   if(s.offer){await pcs[id].setRemoteDescription(s.offer); const ans=await pcs[id].createAnswer(); await pcs[id].setLocalDescription(ans); db.ref('radio/'+salaActual+'/signals/'+id+'/'+yoRef.key).push({from:yoRef.key,answer:ans,nombre:miNombre});}
   if(s.answer){await pcs[id].setRemoteDescription(s.answer);}
   if(s.candidate){try{await pcs[id].addIceCandidate(s.candidate);}catch(e){}}
 });
 db.ref('radio/'+salaActual+'/notas').on('child_added',snap=>{const n=snap.val(); if(n.from==miNombre) return; addMsg(`<b>${n.from} 🎧 nota:</b><br><audio controls src="${n.audio}"></audio>`);});
 document.getElementById('estado').innerText='Conectado. Mantén para hablar a todos.';
 yoRef.key && (yoRef.key=yoRef.key); window._yo=yoRef.key; window._sala=salaActual;
}
function crearPC(id,info,esCaller){
 const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
 pcs[id]=pc; localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>{let a=document.getElementById('a_'+id); if(!a){a=document.createElement('audio');a.id='a_'+id;a.autoplay=true;a.playsInline=true;document.body.appendChild(a); addMsg(`🔊 ${info.nombre} conectado`);} a.srcObject=e.streams[0]; a.muted=muted;};
 pc.onicecandidate=e=>{if(e.candidate) db.ref('radio/'+salaActual+'/signals/'+id+'/'+window._yo).push({from:window._yo,candidate:e.candidate,nombre:miNombre});};
 if(esCaller){pc.createOffer().then(o=>pc.setLocalDescription(o).then(()=>{db.ref('radio/'+salaActual+'/signals/'+id+'/'+window._yo).push({from:window._yo,offer:o,nombre:miNombre});}));}
}
let hablando=false;
function setTalk(v){localStream.getAudioTracks().forEach(t=>t.enabled=v); hablando=v; btnHablar.classList.toggle('hablando',v); btnHablar.innerText=v?'🔴 HABLANDO...':'🎤 MANTÉN PARA HABLAR';}
btnHablar.addEventListener('pointerdown',e=>{e.preventDefault(); setTalk(true);});
btnHablar.addEventListener('pointerup',e=>{e.preventDefault(); setTalk(false);});
btnHablar.addEventListener('pointerleave',()=>setTalk(false));
// iniciar silenciado tipo walkie
document.getElementById('entrar').onclick=async()=>{await entrar(); setTalk(false);};
// notas de voz
let rec, chunks=[];
document.getElementById('btnNota').onclick=async()=>{
 if(rec && rec.state=='recording'){rec.stop(); return;}
 const s=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(s); chunks=[]; rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=async()=>{const blob=new Blob(chunks,{type:'audio/webm'}); const reader=new FileReader(); reader.onload=()=>{db.ref('radio/'+salaActual+'/notas').push({from:miNombre,audio:reader.result,ts:Date.now()}); addMsg(`<b>Tú 🎤 nota:</b><br><audio controls src="${reader.result}"></audio>`,true);}; reader.readAsDataURL(blob);};
 rec.start(); addMsg('Grabando nota... presiona de nuevo para enviar',true); setTimeout(()=>{if(rec.state=='recording')rec.stop();},10000);
};
document.getElementById('btnSilenciar').onclick=()=>{muted=!muted; document.querySelectorAll('audio').forEach(a=>a.muted=muted); document.getElementById('btnSilenciar').innerText=muted?'🔊 Sonido':'🔇 Silenciar';};
</script></body></html>
