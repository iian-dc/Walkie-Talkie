<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walkie Talkie</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.top{padding:12px;background:#1c1c1c;display:flex;gap:8px;align-items:center}
.top b{font-size:14px}
.top input{flex:1;padding:12px;border-radius:10px;border:0;background:#2a2a2a;color:#fff}
.btn{padding:12px 16px;border-radius:10px;border:0;font-weight:800;background:#22c55e;color:#000}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#111}
.msg{background:#222;padding:10px 12px;border-radius:12px;max-width:85%;font-size:14px}
.msg.me{background:#2563eb;align-self:flex-end}
.footer{padding:14px;background:#1c1c1c}
#btnHablar{width:100%;padding:24px;border-radius:30px;background:#22c55e;border:0;font-size:20px;font-weight:900;touch-action:none}
#btnHablar.hablando{background:#ef4444;color:#fff;transform:scale(.97)}
.small{display:flex;gap:8px;margin-top:10px}
.small button{flex:1;background:#2a2a2a;color:#fff;border:0;padding:10px;border-radius:10px}
#estado{text-align:center;margin-bottom:10px;font-size:13px;opacity:.7}
</style>
</head>
<body>
<div class="top">
<b>Walkie Talkie</b>
<input id="sala" value="reparto1" placeholder="Sala">
<input id="nombre" placeholder="Nombre" style="max-width:110px">
<button class="btn" id="entrar">ENTRAR</button>
</div>
<div id="chat"></div>
<div class="footer">
<div id="estado">Presiona ENTRAR y permite el micro</div>
<button id="btnHablar">🎤 MANTEN PARA HABLAR</button>
<div class="small">
<button id="btnNota">🎙️ Nota de voz</button>
<button id="btnMute">🔊 Sonido</button>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDvetl-4f68ykb5GpGSZtCAvOeetKmnh-4",authDomain:"menu-digital-12e66.firebaseapp.com",databaseURL:"https://menu-digital-12e66-default-rtdb.firebaseio.com",projectId:"menu-digital-12e66",appId:"1:388372771516:web:516a80aeeecc1ab8f756b9"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let localStream, pcs={}, sala, nombre, yoId, muted=false, rec, chunks=[];
const chat=document.getElementById('chat');
function log(t,me=false){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
async function entrar(){
 sala=document.getElementById('sala').value.trim().toLowerCase()||'reparto1';
 nombre=document.getElementById('nombre').value.trim()||'Usuario'+Math.floor(Math.random()*100);
 try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
 catch(e){alert('Debes permitir microfono: '+e);return;}
 localStream.getAudioTracks().forEach(t=>t.enabled=false);
 const ref=db.ref('radio/'+sala+'/users');
 const yo=ref.push({nombre:nombre,ts:Date.now()});
 yoId=yo.key; yo.onDisconnect().remove();
 log('✅ Entraste a <b>'+sala+'</b> como <b>'+nombre+'</b>',true);
 document.getElementById('estado').innerText='Conectado a '+sala+'. Mantén presionado para hablar';
 ref.on('child_added',async snap=>{if(snap.key===yoId) return; await crearPC(snap.key,snap.val(),true);});
 ref.on('child_removed',snap=>{if(pcs[snap.key]){pcs[snap.key].close();delete pcs[snap.key];}});
 db.ref('radio/'+sala+'/signals/'+yoId).on('child_added',async snap=>{
  const s=snap.val(); const id=s.from;
  if(!pcs[id]) await crearPC(id,{nombre:s.nombre},false);
  if(s.offer){await pcs[id].setRemoteDescription(s.offer); const ans=await pcs[id].createAnswer(); await pcs[id].setLocalDescription(ans); db.ref('radio/'+sala+'/signals/'+id+'/'+yoId).push({from:yoId,answer:ans,nombre:nombre});}
  if(s.answer){await pcs[id].setRemoteDescription(s.answer);}
  if(s.candidate){try{await pcs[id].addIceCandidate(s.candidate);}catch(e){}}
 });
 db.ref('radio/'+sala+'/notas').on('child_added',snap=>{const n=snap.val(); if(n.from===nombre) return; log(`<b>${n.from} 🎧:</b><br><audio controls src="${n.audio}"></audio>`);});
}
async function crearPC(id,info,caller){
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 pcs[id]=pc;
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>{let a=document.getElementById('a_'+id); if(!a){a=document.createElement('audio');a.id='a_'+id;a.autoplay=true;a.playsInline=true;document.body.appendChild(a); log(`🔊 ${info.nombre} conectado`);} a.srcObject=e.streams[0]; a.muted=muted;};
 pc.onicecandidate=e=>{if(e.candidate) db.ref('radio/'+sala+'/signals/'+id+'/'+yoId).push({from:yoId,candidate:e.candidate,nombre:nombre});};
 if(caller){const off=await pc.createOffer(); await pc.setLocalDescription(off); db.ref('radio/'+sala+'/signals/'+id+'/'+yoId).push({from:yoId,offer:off,nombre:nombre});}
}
const btn=document.getElementById('btnHablar');
function talk(v){if(!localStream) return; localStream.getAudioTracks().forEach(t=>t.enabled=v); btn.classList.toggle('hablando',v); btn.innerText=v?'🔴 HABLANDO...':'🎤 MANTEN PARA HABLAR';}
btn.addEventListener('pointerdown',e=>{e.preventDefault();talk(true);});
btn.addEventListener('pointerup',e=>{e.preventDefault();talk(false);});
btn.addEventListener('pointercancel',()=>talk(false));
btn.addEventListener('pointerleave',()=>talk(false));
document.getElementById('entrar').onclick=entrar;
document.getElementById('btnNota').onclick=async()=>{
 if(rec && rec.state==='recording'){rec.stop();return;}
 const s=await navigator.mediaDevices.getUserMedia({audio:true});
 rec=new MediaRecorder(s); chunks=[]; rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'}); const r=new FileReader(); r.onload=()=>{db.ref('radio/'+sala+'/notas').push({from:nombre,audio:r.result,ts:Date.now()}); log(`<b>Tú 🎤:</b><br><audio controls src="${r.result}"></audio>`,true);}; r.readAsDataURL(blob); document.getElementById('btnNota').innerText='🎙️ Nota de voz';};
 rec.start(); document.getElementById('btnNota').innerText='⏹️ Enviar nota'; setTimeout(()=>{if(rec.state==='recording')rec.stop();},10000);
};
document.getElementById('btnMute').onclick=()=>{muted=!muted; document.querySelectorAll('audio').forEach(a=>a.muted=muted); document.getElementById('btnMute').innerText=muted?'🔇 Silenciado':'🔊 Sonido';};
</script>
</body>
</html>
